name: API CI

on:
  push:
    branches: [main]
    paths: ["python/evalstone-api/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["python/evalstone-api/**", ".github/workflows/api.yml"]

jobs:
  check:
    name: ruff · pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: evalstone
          POSTGRES_PASSWORD: evalstone
          POSTGRES_DB: evalstone_api_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U evalstone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DB_USER: evalstone
      DB_PASS: evalstone
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_TEST_NAME: evalstone_api_test
      REDIS_URL: redis://localhost:6379/7
      CELERY_BROKER_URL: redis://localhost:6379/7
      CELERY_RESULT_BACKEND: redis://localhost:6379/7
      JWT_SECRET: ci-only-ci-only-ci-only-ci-only-32
    defaults:
      run:
        working-directory: python/evalstone-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
