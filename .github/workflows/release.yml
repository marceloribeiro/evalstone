name: Release (PyPI)

# Publishes python/evalstone to PyPI on a `lib-v*` tag via PyPI trusted publishing.
# Operator setup (once): on pypi.org, project "evalstone" → Publishing → add a
# GitHub publisher: owner marceloribeiro, repo evalstone, workflow release.yml,
# environment pypi. Then: git tag lib-v0.1.0 && git push --tags.

on:
  push:
    tags: ["lib-v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/evalstone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build && pip install -e ".[dev]"
      - run: ruff check . && ruff format --check . && pytest
      - name: Check the tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#lib-v}"
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$TAG" = "$VERSION" || { echo "tag $TAG != version $VERSION"; exit 1; }
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/evalstone/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
