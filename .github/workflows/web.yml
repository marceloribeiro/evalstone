name: Web CI

on:
  push:
    branches: [main]
    paths: ["javascript/evalstone-web/**", "python/evalstone-api/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["javascript/evalstone-web/**", "python/evalstone-api/**", ".github/workflows/web.yml"]

jobs:
  check:
    name: lint · typecheck · Playwright E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: evalstone
          POSTGRES_PASSWORD: evalstone
          POSTGRES_DB: evalstone_web_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U evalstone" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8181
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: javascript/evalstone-web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: start the center API (the thing the web app talks to)
        working-directory: python/evalstone-api
        env:
          APP_ENV: test
          DB_USER: evalstone
          DB_PASS: evalstone
          DB_HOST: localhost
          DB_NAME: evalstone_web_e2e
          DB_TEST_NAME: evalstone_web_e2e
          REDIS_URL: redis://localhost:6379/7
          CELERY_BROKER_URL: redis://localhost:6379/7
          CELERY_RESULT_BACKEND: redis://localhost:6379/7
          CELERY_TASK_ALWAYS_EAGER: "1"
          JWT_SECRET: ci-only-ci-only-ci-only-ci-only-32
          CORS_ORIGINS: http://localhost:8192
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8181 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS localhost:8181/ready && break; sleep 1; done
      - working-directory: javascript/evalstone-web
        run: npm ci
      - working-directory: javascript/evalstone-web
        run: npm run lint && npm run types:check
      - working-directory: javascript/evalstone-web
        run: npx playwright install --with-deps chromium
      - working-directory: javascript/evalstone-web
        run: npx playwright test
        env:
          CI: "true"
      - if: failure()
        run: tail -100 /tmp/api.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: javascript/evalstone-web/playwright-report/
