<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Evalstone</title>
  <!-- the touchstone: a faceted basalt stone; the rim keeps it legible on dark backgrounds -->
  <path d="M20 4 44 5 58 19 59 38 47 57 27 60 10 50 5 30 9 14Z" fill="#292524" stroke="#78716C" stroke-width="1.4" stroke-linejoin="round"/>
  <g stroke-linejoin="round" stroke-width=".7">
    <path d="M20 4 44 5 26 21 9 14Z" fill="#57534E" stroke="#57534E"/>
    <path d="M44 5 58 19 41 29 26 21Z" fill="#44403C" stroke="#44403C"/>
    <path d="M58 19 59 38 47 57 41 29Z" fill="#292524" stroke="#292524"/>
    <path d="M47 57 27 60 31 43 41 29Z" fill="#1C1917" stroke="#1C1917"/>
    <path d="M27 60 10 50 5 30 31 43Z" fill="#292524" stroke="#292524"/>
    <path d="M5 30 9 14 26 21 31 43Z" fill="#3A3532" stroke="#3A3532"/>
    <path d="M26 21 41 29 31 43Z" fill="#322D2A" stroke="#322D2A"/>
  </g>
  <!-- the streak real gold leaves on it, drawn as a tick -->
  <path d="M17 36.5 26.5 45.5 50 14.5" fill="none" stroke="#D97706" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M28.5 41.5 47 17" fill="none" stroke="#FCD34D" stroke-width="1.3" stroke-linecap="round" opacity=".7"/>
</svg>
