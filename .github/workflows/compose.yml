name: Compose smoke

on:
  push:
    branches: [main]
    paths: ["docker-compose.yml", "env.docker.example", "python/evalstone-api/**", ".github/workflows/compose.yml"]
  pull_request:
    paths: ["docker-compose.yml", "env.docker.example", "python/evalstone-api/**", ".github/workflows/compose.yml"]

jobs:
  cold-start:
    name: docker compose up from a clean checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: write .env
        run: |
          cp env.docker.example .env
          JWT=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')
          CREDS=$(python3 -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')
          sed -i "s|^DB_PASS=.*|DB_PASS=ci-p@ss/w0rd#1|; s|^JWT_SECRET=.*|JWT_SECRET=$JWT|; s|^PROVIDER_CREDS_KEY=.*|PROVIDER_CREDS_KEY=$CREDS|; s|^DOCS_PASSWORD=.*|DOCS_PASSWORD=ci-docs-pass|" .env
          grep -c "=." .env   # 5 non-empty values
      - run: docker compose up -d --build --wait --wait-timeout 300
      - run: docker compose ps
      - name: the API answers and a user can register
        run: |
          curl -fsS localhost:8181/ready
          curl -fsS -X POST localhost:8181/auth/register -H 'content-type: application/json' -d '{"email":"ci@example.com","password":"ci-password-1"}' | head -c 200
      - name: the worker and beat are running
        run: |
          # --wait already covered the worker's healthcheck (its own ping); confirm from the api side too
          for i in $(seq 1 12); do
            docker compose exec -T api celery -A app.worker.celery_app inspect ping --timeout 5 && break
            sleep 5
          done
          docker compose exec -T api celery -A app.worker.celery_app inspect ping --timeout 5
          docker compose logs beat | grep -q "beat: Starting"
      - if: always()
        run: docker compose logs --no-color api worker beat | tail -100
      - if: always()
        run: docker compose down -v
