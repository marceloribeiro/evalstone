name: Lib CI

on:
  push:
    branches: [main]
    paths: ["python/evalstone/**", "README.md", "docs/ROADMAP.md", ".github/workflows/lib.yml"]
  pull_request:
    paths: ["python/evalstone/**", "README.md", "docs/ROADMAP.md", ".github/workflows/lib.yml"]

jobs:
  check:
    name: ruff · pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: python/evalstone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
