name: Site CI

on:
  push:
    branches: [main]
    paths: ["javascript/evalstone-site/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["javascript/evalstone-site/**", ".github/workflows/site.yml"]

jobs:
  check:
    name: lint · typecheck · build · e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: javascript/evalstone-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: javascript/evalstone-site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run types:check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: javascript/evalstone-site/playwright-report
          retention-days: 7
