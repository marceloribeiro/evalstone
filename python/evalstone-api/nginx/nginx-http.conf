# api.evalstone.com — HTTP vhost (serves the ACME challenge until TLS is issued).
# WebSocket: the map must appear once per http{}; keep a single map block if site files are merged.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    include /opt/nginx/conf/snippets/secret-probe-block.conf;
    include /opt/nginx/conf/snippets/block-meta-crawler.conf;
    listen 80;
    server_name api.evalstone.com;

    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/certbot/.well-known/acme-challenge/;
        default_type text/plain;
    }

    client_max_body_size 50M;

    # WebSocket: /ws and /ws/... (the query string is not part of the URI nginx matches)
    location ~ ^/ws(/|$) {
        proxy_pass http://127.0.0.1:8181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1200s;
        proxy_connect_timeout 1200s;
        proxy_send_timeout 1200s;
    }
}
