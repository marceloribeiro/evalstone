# app.evalstone.com — HTTPS vhost (installed by `just setup-nginx-https` once shared/certs/ exists).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    include /opt/nginx/conf/snippets/secret-probe-block.conf;
    include /opt/nginx/conf/snippets/block-meta-crawler.conf;
    listen 80;
    server_name app.evalstone.com;

    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/certbot/.well-known/acme-challenge/;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    include /opt/nginx/conf/snippets/secret-probe-block.conf;
    include /opt/nginx/conf/snippets/block-meta-crawler.conf;
    listen 443 ssl;
    http2 on;
    server_name app.evalstone.com;

    ssl_certificate     /home/ubuntu/evalstone-web/current/certs/fullchain.pem;
    ssl_certificate_key /home/ubuntu/evalstone-web/current/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8182;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1200s;
        proxy_connect_timeout 1200s;
        proxy_send_timeout 1200s;
    }
}
