name: Release (PyPI)

# Publishes python/evalstone to PyPI on a `lib-vX.Y.Z` tag via PyPI trusted publishing.
#
# Operator setup (once): on pypi.org, project "evalstone" → Publishing → add a
# GitHub publisher: owner marceloribeiro, repo evalstone, workflow release.yml,
# environment pypi. In this repo: Settings → Environments → create `pypi`.
#
# Release ritual (per version):
#   1. set `__version__` in python/evalstone/src/evalstone/__init__.py
#   2. date the top section of python/evalstone/CHANGELOG.md: `## X.Y.Z — YYYY-MM-DD`
#   3. merge to main, then tag THAT commit and push the single tag:
#        git tag lib-vX.Y.Z && git push origin lib-vX.Y.Z
# The workflow refuses tags on commits that are not on main, tags that do not match
# `__version__`, and changelogs whose top section is still "unreleased".

on:
  push:
    tags: ["lib-v*"]

jobs:
  guard:
    name: tag is on main · matches __version__ · changelog dated
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tagged commit must be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"; exit 1; }
      - name: The tag must match __version__
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#lib-v}"
          VERSION=$(python3 - <<'PY'
          import re, pathlib
          src = pathlib.Path("python/evalstone/src/evalstone/__init__.py").read_text()
          print(re.search(r'^__version__ = "([^"]+)"', src, re.M).group(1))
          PY
          )
          test "$TAG" = "$VERSION" || { echo "::error::tag $TAG != __version__ $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: The changelog's top section must be dated for this version
        run: |
          V="${{ steps.version.outputs.version }}"
          grep -qE "^## ${V//./\\.} — [0-9]{4}-[0-9]{2}-[0-9]{2}$" python/evalstone/CHANGELOG.md \
            || { echo "::error::CHANGELOG.md needs a dated '## $V — YYYY-MM-DD' section (not 'unreleased')"; exit 1; }

  build:
    needs: guard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/evalstone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build && pip install -e ".[dev]"
      - run: ruff check . && ruff format --check . && pytest
      - run: python -m build
      - name: The wheel must carry the license
        run: python -c "import zipfile,glob;w=glob.glob('dist/*.whl')[0];n=zipfile.ZipFile(w).namelist();assert any('LICENSE' in x for x in n), n"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/evalstone/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
